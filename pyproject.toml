[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "well-product"
version = "0.1.0"
description = "Desktop costing application for Well Product"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
well-product = "well_product.app:main"
well-product-seed-hoody = "well_product.scripts.seed_hoody_materials:main"
well-product-seed-hoody-product = "well_product.scripts.seed_hoody_product:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
well_product = ["ui/assets/*", "data/hoody_seed_media/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
